<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nemotron AI - Mobile Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="mobile-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="bot-profile">
                <div class="bot-avatar">
                    <span>AI</span>
                </div>
                <div class="bot-details">
                    <h1 class="bot-name">Nemotron AI</h1>
                    <div class="bot-status">
                        <span class="status-dot"></span>
                        <span class="status-text">Online</span>
                    </div>
                </div>
            </div>

            <button id="resetBtn" class="reset-btn" type="button" title="Reset Percakapan">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                <span>Reset</span>
            </button>
        </header>

        <!-- Chat Area -->
        <section class="chat-area" id="chatArea">
            <div class="messages-list" id="messagesList">
                <!-- Welcome Message -->
                <div class="message-row bot-row">
                    <div class="bubble bot-bubble">
                        <p>Halo! Saya <strong>Nemotron AI</strong>. Ada yang bisa saya bantu hari ini?</p>
                    </div>
                </div>

                <!-- Suggestion Chips -->
                <div class="suggestions-container" id="suggestionsContainer">
                    <button class="chip" onclick="sendSuggestion('Jelaskan apa itu Web Services secara singkat')">
                        🌐 Apa itu Web Services?
                    </button>
                    <button class="chip" onclick="sendSuggestion('Buatkan ide project web sederhana untuk pemula')">
                        💡 Ide Project Web
                    </button>
                    <button class="chip" onclick="sendSuggestion('Tuliskan contoh kode fetch API di JavaScript')">
                        💻 Contoh Fetch API JS
                    </button>
                </div>
            </div>
        </section>

        <!-- Input Area -->
        <footer class="chat-input-container">
            <form class="input-form" id="chatForm" onsubmit="event.preventDefault(); sendMessage();">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        rows="1" 
                        placeholder="Ketik pesan atau gunakan mic..." 
                        autocomplete="off"
                        required></textarea>
                </div>

                <!-- Mic Voice Button -->
                <button type="button" id="micBtn" class="action-btn mic-btn" title="Bicara dengan Mikrofon" aria-label="Gunakan Mikrofon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <!-- Send Button -->
                <button type="submit" id="sendBtn" class="action-btn send-btn" aria-label="Kirim Pesan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
